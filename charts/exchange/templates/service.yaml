apiVersion: v1
kind: Service
metadata:
  name: {{ include "exchange.fullname" . }}
  labels:
    {{- include "exchange.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "exchange.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.exchange.containerPort }}
      targetPort: {{ .Values.exchange.containerPort }}
