{{- if .Values.externalSecrets.enabled }}
# exchange-secret — SAME source secret as mongodb-secret, REMAPPED to the app's key names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "exchange.fullname" . }}-secret
  labels:
    {{- include "exchange.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "exchange.fullname" . }}-secret
    creationPolicy: Owner
  data:
    - secretKey: MONGO_USER
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: MONGO_INITDB_ROOT_USERNAME
    - secretKey: MONGO_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: MONGO_INITDB_ROOT_PASSWORD
{{- end }}
