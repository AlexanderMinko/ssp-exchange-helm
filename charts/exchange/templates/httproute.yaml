{{- if .Values.route.enabled }}
# TargetGroupConfiguration is app-owned (configures THIS Service's target group).
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: {{ include "exchange.fullname" . }}
  labels:
    {{- include "exchange.labels" . | nindent 4 }}
spec:
  targetReference:
    name: {{ include "exchange.fullname" . }}
  defaultConfiguration:
    targetType: ip
---
# HTTPRoute is app-owned; it ATTACHES to the shared Gateway (platform/), it doesn't create one.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "exchange.fullname" . }}
  labels:
    {{- include "exchange.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.gatewayName }}
      namespace: {{ .Values.route.gatewayNamespace }}
      sectionName: {{ .Values.route.sectionName }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "exchange.fullname" . }}
          port: {{ .Values.exchange.containerPort }}
{{- end }}
