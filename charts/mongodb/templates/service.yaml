{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongodb.fullname" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
spec:
  clusterIP: None # headless — DNS resolves directly to the pod IP
  selector:
    {{- include "mongodb.selectorLabels" . | nindent 4 }}
  ports:
    - port: 27017
      targetPort: 27017
{{- end }}
