{{- if .Values.externalSecrets.enabled }}
# mongodb-secret — Mongo root creds, synced by ESO from the shared source secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "mongodb.fullname" . }}-secret
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "mongodb.fullname" . }}-secret
    creationPolicy: Owner
  data:
    - secretKey: MONGO_INITDB_ROOT_USERNAME
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: MONGO_INITDB_ROOT_USERNAME
    - secretKey: MONGO_INITDB_ROOT_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: MONGO_INITDB_ROOT_PASSWORD
{{- end }}
